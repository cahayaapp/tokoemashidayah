<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15100a" />
  <meta name="description" content="Aplikasi kasir dan manajemen Toko Emas Hidayah" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Toko Emas Hidayah</title>
  <link rel="manifest" href="./manifest.webmanifest?v=2.1.1" />
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="stylesheet" href="./assets/css/app.css?v=2.1.1" />
</head>
<body>
  <noscript>Aplikasi ini memerlukan JavaScript untuk berjalan.</noscript>
  <div id="app" class="app-root">
    <div class="splash-screen">
      <div class="brand-mark brand-mark--large">TH</div>
      <div class="splash-copy">
        <strong>Toko Emas Hidayah</strong>
        <span>Menyiapkan aplikasi…</span>
      </div>
    </div>
  </div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module">
    const root = document.getElementById('app');
    const escapeText = value => String(value || '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[char]));
    const showBootError = error => {
      console.error('Boot error:', error);
      const message = error?.message || 'Berkas aplikasi gagal dimuat.';
      root.innerHTML = `<main class="splash-screen"><section class="auth-card" style="color:var(--ink);text-align:center;max-width:620px"><div class="brand-mark brand-mark--large" style="margin:auto">TH</div><h2 style="font-family:Manrope;margin:22px 0 8px">Aplikasi Gagal Dimuat</h2><p style="color:var(--muted);line-height:1.7">${escapeText(message)}</p><p style="color:var(--muted);font-size:13px;line-height:1.6">Muat ulang sekali. Jika pesan ini tetap muncul, ambil tangkapan layar agar kesalahan dapat diperbaiki tepat pada sumbernya.</p><button class="button button--gold button--block" id="boot-reload" style="margin-top:16px">Muat Ulang</button></section></main>`;
      document.getElementById('boot-reload')?.addEventListener('click', () => location.reload());
    };

    try {
      const cacheVersion = localStorage.getItem('teh-clean-version');
      if (cacheVersion !== '2.1.1') {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(item => item.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }
        localStorage.setItem('teh-clean-version', '2.1.1');
      }
      await import('./assets/js/app.js?v=2.1.1');
    } catch (error) {
      showBootError(error);
    }
  </script>
</body>
</html>
